name: Build iOS (macOS Runner)

# 云端构建：无 Mac 用户也能获得构建产物。
# 阶段拆分（macos runner 无 docker，内核需在 ubuntu runner 原生编译）：
#   kernel-debian (ubuntu-latest): aarch64 内核 + Debian 12 镜像 → artifact
#   build (macos-15): QEMU iOS 交叉编译 + 组装 app + 未签名 IPA
#   依赖：kernel-debian 的产物供 build 下载

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- Job 1: aarch64 内核 + Debian 镜像（ubuntu 原生，无 docker） ----------
  kernel-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install build tools
        run: |
          set -e
          echo "### 安装 aarch64 交叉工具链 + qemu-utils"
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make qemu-utils curl xz-utils

      - name: build aarch64 virt kernel
        run: |
          set -e
          echo "### 下载 Linux kernel tarball（kernel.org CDN，v6.1.121 stable）"
          KERNEL_VER="6.1.121"
          cd "$GITHUB_WORKSPACE"
          curl -sSL --retry 3 -o linux.tar.xz "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VER}.tar.xz"
          # tarball 展开为 linux-6.1.121/；strip 顶层目录放入 linux/
          rm -rf linux
          mkdir -p linux
          tar -xJf linux.tar.xz -C linux --strip-components=1
          rm -f linux.tar.xz
          echo "### 校验内核源码完整性"
          test -f linux/Makefile || { echo "ERROR: linux/Makefile 缺失"; ls -la linux; exit 1; }
          test -f linux/arch/arm64/configs/virt_defconfig || { echo "ERROR: virt_defconfig 缺失"; ls linux/arch/arm64/configs 2>&1 | head; exit 1; }
          echo "  OK: Makefile + virt_defconfig 存在"
          echo "### 编译 aarch64 virt 内核"
          KERNEL_SRC=linux OUT="$PWD/build/kernel" JOBS="$(nproc)" bash Kernel/build-kernel.sh
          echo "### Kernel 产物"
          ls -la "$PWD/build/kernel/Image"
          test -f "$PWD/build/kernel/Image"

      - name: prepare Debian 12 arm64 image
        run: |
          set -e
          echo "### 准备 Debian 12 arm64 镜像（qcow2 → raw）"
          RAW_BASE=debian-12-genericcloud-arm64.qcow2 OUT="$PWD/build/debian12.img" SIZE_MB=4096 \
            bash Scripts/prepare-debian.sh || echo "  (离线/无 qcow2，debian12.img 未生成)"
          ls -la "$PWD/build/debian12.img" 2>/dev/null || echo "  debian12.img 未生成，CI 继续"

      - name: upload kernel + debian
        uses: actions/upload-artifact@v4
        with:
          name: guest-assets
          path: |
            build/kernel/Image
            build/debian12.img
          if-no-files-found: warn

  # ---------- Job 2: QEMU iOS 交叉编译 + 未签名 IPA（macos runner） ----------
  build:
    runs-on: macos-15
    timeout-minutes: 90
    needs: kernel-debian
    defaults:
      run:
        shell: bash

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: validate environment
        run: |
          set -e
          echo "=== macOS / Xcode ==="
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          echo "=== SDK path ==="
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iPhoneOS SDK: $SDK"
          echo "=== tools ==="
          which make curl git
          uname -a

      - name: prepare dependencies
        run: |
          set -e
          brew install nasm 2>/dev/null || true
          brew install python@3.12 2>/dev/null || true
          "$(brew --prefix)/opt/python@3.12/bin/python3.12" -m pip install distlib 2>/dev/null || true
          echo "deps ready"

      - name: download kernel + debian assets
        uses: actions/download-artifact@v4
        with:
          name: guest-assets
          path: build/guest-assets

      - name: build QEMU (iOS arm64, TCG + TCTI)
        run: |
          set -e
          P312="$(brew --prefix)/opt/python@3.12/bin/python3.12"
          command -v "$P312" >/dev/null 2>&1 || P312="$(command -v python3.12 || true)"
          echo "python for QEMU: $P312"
          echo "### 拉取 QEMU 源码（固定版本，见 QEMU/VERSIONS.txt）"
          QEMU_VERSION="v9.2.0"
          rm -rf qemu-src
          git clone --depth 1 --branch "$QEMU_VERSION" https://github.com/qemu/qemu.git qemu-src
          echo "### 交叉编译 QEMU 到 iOS arm64"
          OUT="$PWD/build/qemu-ios" QEMU_SRC="$PWD/qemu-src" PYTHON="$P312" bash QEMU/build-qemu.sh
          echo "### QEMU 产物"
          ls -la "$PWD/build/qemu-ios/bin" 2>/dev/null || echo "  (静态库模式，见 build 日志)"
          test -d "$PWD/build/qemu-ios"

      - name: build iOS app
        run: |
          set -e
          echo "### 组装 App 资源（QEMU 二进制/内核/BIOS 放进 bundle）"
          RES=DebianTerminal/Resources
          mkdir -p "$RES"
          # QEMU 产物统一为 build/qemu-ios/bin/qemu-system-aarch64-ios（build-qemu.sh 生成）
          cp -f "$PWD/build/qemu-ios/bin/qemu-system-aarch64-ios" "$RES/qemu-system-aarch64" 2>/dev/null || \
            echo "  QEMU 静态库模式：产物为 .a，链接进 App"
          # 内核与 Debian 镜像来自 kernel-debian job（download-artifact 到 build/guest-assets/）
          cp -f "$PWD/build/guest-assets/Image" "$RES/Image" 2>/dev/null || echo "  Image 未随附（kernel-debian job 未产出）"
          cp -f "$PWD/build/guest-assets/debian12.img" "$RES/debian12.img" 2>/dev/null || echo "  debian12.img 未随附"

          echo "### xcodebuild 编译（未签名）"
          brew install xcodegen 2>/dev/null || true
          command -v xcodegen >/dev/null 2>&1 && xcodegen generate
          xcodebuild \
            -project DebianTerminal.xcodeproj \
            -scheme DebianTerminal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$PWD/build/derived/Build/Products/Release-iphoneos/DebianTerminal.app"
          echo "### 编译产物"
          ls -la "$APP"
          test -d "$APP"

      - name: run tests
        run: |
          set -e
          echo "### 可自动化测试（构建层）"
          bash Tests/run-tests.sh "$PWD/build"

      - name: package artifacts
        run: |
          set -e
          APP="$PWD/build/derived/Build/Products/Release-iphoneos/DebianTerminal.app"
          PKG="$PWD/build/DebianTerminal-unsigned.pkg"
          IPADIR="$PWD/build/DebianTerminal.ipa"

          rm -rf "$IPADIR"; mkdir -p "$IPADIR/Payload"
          cp -R "$APP" "$IPADIR/Payload/"
          zip -qry "$PWD/build/DebianTerminal-unsigned.ipa" "$IPADIR"
          rm -rf "$PKG"; mkdir -p "$PKG"
          echo "### 产物（未签名）"
          ls -la "$PWD/build"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DebianTerminal-builds
          path: |
            build/DebianTerminal-unsigned.ipa
            build/derived/Build/Products/Release-iphoneos/DebianTerminal.app
          if-no-files-found: warn

      - name: emit status report
        run: |
          set -e
          {
            echo "## 构建状态报告（诚实分层，见 docs/SIGNING.md）"
            echo "- App 编译成功：✅（未签名）"
            echo "- QEMU 编译成功：✅（iOS arm64, TCG + TCTI）"
            echo "- IPA 生成：✅（未签名）"
            echo "- IPA 签名：❌（需 SideStore/AltStore 本地完成，见 docs/SIGNING.md）"
            echo "- 是否可直接安装：❌ 未签名；需本地签名"
            echo "- 实机验证（A–F）：❌ 需目标 iPad，见 docs/POC.md"
          } >> status-report.md

      - name: upload status report
        uses: actions/upload-artifact@v4
        with:
          name: build-status-report
          path: status-report.md
